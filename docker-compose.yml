name: nutriapp

services:
  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nutriapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nutriapp_secret}
      POSTGRES_DB: ${POSTGRES_DB:-nutriapp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nutriapp} -d ${POSTGRES_DB:-nutriapp}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Port intentionally NOT exposed to host — only accessible on internal network
    networks:
      - nutriapp-network

  # ─── Node.js API ─────────────────────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nutriapp}:${POSTGRES_PASSWORD:-nutriapp_secret}@postgres:5432/${POSTGRES_DB:-nutriapp}
      ML_SERVICE_URL: http://ml-service:8001
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nutriapp-network
    restart: unless-stopped

  # ─── Python ML microservice ───────────────────────────────────────────────────
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      # No DATABASE_URL — this service never accesses the DB directly
      PYTHONUNBUFFERED: "1"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nutriapp-network
    restart: unless-stopped

  # ─── Ollama local LLM ────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - nutriapp-network
    restart: unless-stopped

  # ─── pgAdmin (only with --profile dev) ───────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["dev"]
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@nutriapp.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    depends_on:
      - postgres
    networks:
      - nutriapp-network

volumes:
  postgres_data:
  ollama_data:

networks:
  nutriapp-network:
    driver: bridge
