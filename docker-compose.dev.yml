name: nutriapp

# Development overrides — merge with docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  api:
    build:
      target: builder  # Use the builder stage which has devDependencies and ts-node
    volumes:
      - ./api/src:/app/src  # Hot-reload: src changes reflect without rebuild
    command: npm run dev
    environment:
      NODE_ENV: development

  ml-service:
    volumes:
      - ./ml-service:/app  # Hot-reload: any .py change triggers reload
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8001

  # Ollama without GPU reservation — for dev machines without NVIDIA
  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - nutriapp-network
